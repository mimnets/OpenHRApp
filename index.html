<script>
  // Dark mode preload — prevents white flash on refresh
  (function() {
    try {
      var darkPref = localStorage.getItem('openhr-dark-mode') || 'system';
      var isDark = darkPref === 'dark' ||
        (darkPref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);

      if (isDark) {
        // Apply dark class immediately — the .dark CSS rules in the static
        // hero <style> block handle background/text overrides for both the
        // skeleton and body, so no element lookups are needed here.
        document.documentElement.classList.add('dark');

        // Update theme-color meta tag to dark
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', '#0f172a');
      }
    } catch(e) {}
  })();
</script>

<script>
  // Auth-aware: hide the landing-page skeleton when the user already has a
  // Supabase session in localStorage. This prevents authenticated users from
  // briefly seeing the landing hero on refresh / PWA cold start. Crawlers
  // (no JS / no localStorage) always see the full hero for SEO.
  (function() {
    try {
      var hasSession = false;
      for (var i = 0; i < localStorage.length; i++) {
        var key = localStorage.key(i);
        if (key && /^sb-[a-z0-9]+-auth-token$/i.test(key)) {
          try {
            var raw = localStorage.getItem(key);
            if (raw) {
              var session = JSON.parse(raw);
              if (session && session.access_token) { hasSession = true; break; }
            }
          } catch(e) { /* corrupt entry, keep checking */ }
        }
      }
      if (hasSession) {
        var hero = document.getElementById('static-hero');
        if (hero) hero.classList.add('sh-auth-session');
      }
    } catch(e) {}
  })();
</script>
<script>
  // Capture install prompt event (must be inline, not in ESM module,
  // because on slower devices beforeinstallprompt fires before modules load)
  window.addEventListener('beforeinstallprompt', function(e) {
    e.preventDefault();
    window.deferredPWAPrompt = e;
    window.dispatchEvent(new CustomEvent('pwa-install-available'));
    console.log('PWA: Install prompt captured');
  });

  // Track successful installation
  window.addEventListener('appinstalled', function() {
    console.log('PWA: Successfully installed');
    window.deferredPWAPrompt = null;
    window.dispatchEvent(new CustomEvent('pwa-installed'));
  });
</script>
