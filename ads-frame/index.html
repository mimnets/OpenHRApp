<!doctype html>
<!--
  OpenHRApp ad frame. Deployed on its own origin (ads.openhrapp.com, Cloudflare Pages) and
  embedded by the app's dashboard in a sandboxed <iframe>. Every third-party ad script runs
  here, never on the app's origin, so it cannot read employee data. See ads-frame/README.md.

  Which providers run, their keys and weights are set in Super Admin -> Ads -> Dashboard Ads
  and read from the public get_ad_frame_settings() RPC. Nothing here needs editing after setup.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Advertisement</title>
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
    body { display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; }
    #ad { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
    #ad a, #ad img { display: block; max-width: 100%; max-height: 100%; }
    #ad iframe { border: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
    .house { color: #0f766e; background: #f0fdfa; border-radius: 8px; padding: 12px 16px; text-decoration: none; font-size: 14px; text-align: center; }
  </style>
</head>
<body>
  <div id="ad"></div>
  <script>
    // ── One-time setup: the same public values as VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY. ──
    var SUPABASE_URL = 'https://cixryuwtlwbofabctrkk.supabase.co';
    var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNpeHJ5dXd0bHdib2ZhYmN0cmtrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1NTgzMjcsImV4cCI6MjA5NDEzNDMyN30.DIsKHuNmR6ivb2oAdukpDDV8XSlK9km1KJDQ0O8yUEE';
    // Shown when ads are off, nothing is configured, or the settings cannot be loaded.
    var HOUSE = { href: 'https://openhrapp.com/pricing', text: 'Remove ads — OpenHRApp ad-free plan' };

    var slot = document.getElementById('ad');

    function house() {
      slot.innerHTML = '';
      var a = document.createElement('a');
      a.className = 'house'; a.href = HOUSE.href; a.target = '_blank'; a.rel = 'noopener';
      a.textContent = HOUSE.text;
      slot.appendChild(a);
    }

    function https(v) {
      try { return new URL(v).protocol === 'https:'; } catch (e) { return false; }
    }

    // The app asks for ?size=wide (728x90, desktop) or small (300x250, phones and narrow spaces).
    var WIDE = new URLSearchParams(location.search).get('size') === 'wide';
    var KEY = /^[A-Za-z0-9]+$/;

    // Each value is re-validated here, not only in Super Admin: this page is public.
    var providers = {
      adsterra: {
        ok: function (p) { return KEY.test(p.key || ''); },
        render: function (p) {
          // Desktop uses the 728x90 key when there is one; otherwise the 300x250 banner, centered.
          var wide = WIDE && KEY.test(p.keyWide || '');
          var key = wide ? p.keyWide : p.key;
          var w = wide ? 728 : 300, h = wide ? 90 : 250;
          // Adsterra's banner tag may use document.write, so it runs in its own srcdoc document
          // where it is parsed normally (same origin as this page, still isolated from the app).
          var f = document.createElement('iframe');
          f.style.width = w + 'px'; f.style.height = h + 'px';
          f.srcdoc = '<!doctype html><body style="margin:0;display:flex;justify-content:center">' +
            '<script>atOptions={key:"' + key + '",format:"iframe",height:' + h + ',width:' + w + ',params:{}};<\/script>' +
            '<script src="https://www.highperformanceformat.com/' + key + '/invoke.js"><\/script></body>';
          slot.appendChild(f);
        }
      },
      aads: {
        ok: function (p) { return /^\d+$/.test(p.unit || ''); },
        render: function (p) {
          var f = document.createElement('iframe');
          f.setAttribute('data-aa', p.unit);
          f.src = 'https://acceptable.a-ads.com/' + p.unit + '/?size=Adaptive';
          slot.appendChild(f);
        }
      },
      zoho: {
        ok: function (p) { return https(p.img) && https(p.href); },
        render: function (p) {
          var a = document.createElement('a');
          a.href = p.href; a.target = '_blank'; a.rel = 'sponsored noopener';
          var img = document.createElement('img');
          img.src = WIDE && https(p.imgWide) ? p.imgWide : p.img; img.alt = 'Zoho — business apps for growing teams'; img.onerror = house;
          a.appendChild(img);
          slot.appendChild(a);
        }
      }
    };

    // Weighted random pick, so each dashboard load rotates between the enabled providers.
    function pick(list) {
      var total = list.reduce(function (n, x) { return n + x.weight; }, 0);
      var r = Math.random() * total;
      for (var i = 0; i < list.length; i++) { r -= list[i].weight; if (r < 0) return list[i]; }
      return list[list.length - 1];
    }

    function show(cfg) {
      if (!cfg || cfg.enabled !== true) return house();
      var ready = Object.keys(providers).filter(function (name) {
        var p = cfg[name];
        return p && p.enabled === true && p.weight > 0 && providers[name].ok(p);
      }).map(function (name) { return { name: name, weight: cfg[name].weight }; });
      if (!ready.length) return house();
      var chosen = pick(ready).name;
      providers[chosen].render(cfg[chosen]);
    }

    if (!SUPABASE_URL || !SUPABASE_ANON_KEY) {
      house();
    } else {
      fetch(SUPABASE_URL + '/rest/v1/rpc/get_ad_frame_settings', {
        method: 'POST',
        headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
        body: '{}'
      })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(show)
        .catch(house);
    }
  </script>
</body>
</html>
