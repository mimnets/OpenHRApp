<!doctype html>
<!--
  OpenHRApp ad frame. Deployed on its own origin (ads.openhrapp.com, Cloudflare Pages) and
  embedded by the app in a sandboxed <iframe>. Every third-party ad script runs here, never on
  the app's origin, so it cannot read employee data. See ads-frame/README.md.

  Which providers run, their keys, sizes and weights are set in Super Admin -> Ads -> Platform Ads
  and read from the public get_ad_frame_settings() RPC. Nothing here needs editing after setup.

  Sizing: the app passes ?maxw=<widest ad that fits>. This page picks a creative no wider than
  that (or the narrowest available, which the app then scales down), draws it at the top-left,
  and posts {type:'openhr-ad-size', w, h} to the app, which sizes its box to match exactly.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Advertisement</title>
  <style>
    html, body { margin: 0; background: transparent; overflow: hidden; font-family: system-ui, sans-serif; }
    #ad { position: absolute; top: 0; left: 0; overflow: hidden; }
    #ad a, #ad img { display: block; }
    #ad iframe { border: 0; display: block; overflow: hidden; background: transparent; }
    .house { box-sizing: border-box; display: flex !important; align-items: center; justify-content: center;
      color: #0f766e; background: #f0fdfa; border-radius: 8px; text-decoration: none; font-size: 14px; text-align: center; }
  </style>
</head>
<body>
  <div id="ad"></div>
  <script>
    // ── One-time setup: the same public values as VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY. ──
    var SUPABASE_URL = 'https://cixryuwtlwbofabctrkk.supabase.co';
    var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNpeHJ5dXd0bHdib2ZhYmN0cmtrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1NTgzMjcsImV4cCI6MjA5NDEzNDMyN30.DIsKHuNmR6ivb2oAdukpDDV8XSlK9km1KJDQ0O8yUEE';
    // Shown when ads are off, nothing is configured, or the settings cannot be loaded.
    var HOUSE = { href: 'https://openhrapp.com/pricing', text: 'Remove ads — OpenHRApp ad-free plan' };

    var slot = document.getElementById('ad');
    var maxw = parseInt(new URLSearchParams(location.search).get('maxw'), 10);
    if (!(maxw > 0 && maxw <= 1000)) maxw = 300;

    function report(w, h) {
      slot.style.width = w + 'px'; slot.style.height = h + 'px';
      // Sizes only, nothing sensitive, so any parent may read it; the app checks origin and source.
      parent.postMessage({ type: 'openhr-ad-size', w: Math.round(w), h: Math.round(h) }, '*');
    }

    function house() {
      slot.innerHTML = '';
      var a = document.createElement('a');
      a.className = 'house'; a.href = HOUSE.href; a.target = '_blank'; a.rel = 'noopener';
      a.textContent = HOUSE.text;
      var w = Math.min(maxw, 468), h = 60;
      a.style.width = w + 'px'; a.style.height = h + 'px';
      slot.appendChild(a);
      report(w, h);
    }

    function https(v) {
      try { return new URL(v).protocol === 'https:'; } catch (e) { return false; }
    }

    function parseSize(s) {
      var m = /^(\d+)x(\d+)$/.exec(s || '');
      return m ? { w: +m[1], h: +m[2] } : null;
    }

    // Widest option that fits maxw; if none fits, the narrowest (the app scales it down).
    function bestFit(options) {
      var fits = options.filter(function (o) { return o.w <= maxw; });
      var pool = fits.length ? fits : options;
      return pool.reduce(function (a, b) {
        return fits.length ? (b.w > a.w ? b : a) : (b.w < a.w ? b : a);
      });
    }

    var KEY = /^[A-Za-z0-9]+$/;

    // Each value is re-validated here, not only in Super Admin: this page is public.
    var providers = {
      adsterra: {
        ok: function (p) { return KEY.test(p.key || ''); },
        render: function (p) {
          var units = [{ key: p.key, size: p.keySize || '300x250' }, { key: p.keyWide, size: p.keyWideSize || '728x90' }]
            .filter(function (u) { return KEY.test(u.key || '') && parseSize(u.size); })
            .map(function (u) { var s = parseSize(u.size); return { key: u.key, w: s.w, h: s.h }; });
          if (!units.length) return house();
          var u = bestFit(units);
          // Adsterra's banner tag may use document.write, so it runs in its own srcdoc document
          // where it is parsed normally (same origin as this page, still isolated from the app).
          var f = document.createElement('iframe');
          f.style.width = u.w + 'px'; f.style.height = u.h + 'px';
          f.setAttribute('scrolling', 'no');
          f.srcdoc = '<!doctype html><body style="margin:0;overflow:hidden">' +
            '<script>atOptions={key:"' + u.key + '",format:"iframe",height:' + u.h + ',width:' + u.w + ',params:{}};<\/script>' +
            '<script src="https://www.highperformanceformat.com/' + u.key + '/invoke.js"><\/script></body>';
          slot.appendChild(f);
          report(u.w, u.h);
        }
      },
      aads: {
        ok: function (p) { return /^\d+$/.test(p.unit || ''); },
        render: function (p) {
          var s = bestFit([{ w: 728, h: 90 }, { w: 468, h: 60 }, { w: 300, h: 250 }]);
          var f = document.createElement('iframe');
          f.setAttribute('data-aa', p.unit);
          f.setAttribute('scrolling', 'no');
          f.src = 'https://acceptable.a-ads.com/' + p.unit + '/?size=' + s.w + 'x' + s.h;
          f.style.width = s.w + 'px'; f.style.height = s.h + 'px';
          slot.appendChild(f);
          report(s.w, s.h);
        }
      },
      zoho: {
        ok: function (p) { return https(p.img) && https(p.href); },
        render: function (p) {
          var a = document.createElement('a');
          a.href = p.href; a.target = '_blank'; a.rel = 'sponsored noopener';
          var img = document.createElement('img');
          img.alt = 'Zoho — business apps for growing teams';
          img.onload = function () { report(img.naturalWidth, img.naturalHeight); };
          img.onerror = house;
          img.src = maxw >= 728 && https(p.imgWide) ? p.imgWide : p.img;
          a.appendChild(img);
          slot.appendChild(a);
        }
      }
    };

    // Weighted random pick, so each banner load rotates between the enabled providers.
    function pick(list) {
      var total = list.reduce(function (n, x) { return n + x.weight; }, 0);
      var r = Math.random() * total;
      for (var i = 0; i < list.length; i++) { r -= list[i].weight; if (r < 0) return list[i]; }
      return list[list.length - 1];
    }

    function show(cfg) {
      if (!cfg || cfg.enabled !== true) return house();
      var ready = Object.keys(providers).filter(function (name) {
        var p = cfg[name];
        return p && p.enabled === true && p.weight > 0 && providers[name].ok(p);
      }).map(function (name) { return { name: name, weight: cfg[name].weight }; });
      if (!ready.length) return house();
      var chosen = pick(ready).name;
      providers[chosen].render(cfg[chosen]);
    }

    if (!SUPABASE_URL || !SUPABASE_ANON_KEY) {
      house();
    } else {
      fetch(SUPABASE_URL + '/rest/v1/rpc/get_ad_frame_settings', {
        method: 'POST',
        headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
        body: '{}'
      })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(show)
        .catch(house);
    }
  </script>
</body>
</html>
